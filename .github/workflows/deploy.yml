name: Docker Build & Deploy

on:
  push:
    branches: [main, develop, docker-env, evaluation/unha]
    paths: [Dockerfile, pyproject.toml, uv.lock, "orchestrator/**"]
  pull_request:
    branches: [main, develop, docker-env, evaluation/unha]
    paths: [Dockerfile, pyproject.toml, uv.lock, "orchestrator/**"]

permissions:
  contents: read

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run python -m pytest orchestrator/tests -q
        env:
          LLM_ENABLE_API_CALL: "false"
          LLM_DEFAULT_PROVIDER: mock
          T2I_DEFAULT_ENGINE: mock

  build-pr:
    name: docker-build-only
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  publish:
    name: docker-build-and-push
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: unhalim/codeit-final
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
