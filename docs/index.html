<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="0; url=./PPT/">
    <title>EasyAds Agent 발표 자료</title>
    <link rel="canonical" href="./PPT/">
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f7f8f4;
        color: #171817;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(520px, calc(100vw - 48px));
        padding: 32px;
        border: 1px solid #dfe8c9;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 20px 60px rgba(23, 24, 23, 0.08);
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
        line-height: 1.25;
      }

      p {
        margin: 0 0 24px;
        color: #5d625d;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 999px;
        background: #b8e84d;
        color: #171817;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>개떡찰떡 발표 자료</h1>
      <p>잠시 후 발표 페이지로 이동합니다.</p>
      <a href="./PPT/">발표 자료 열기</a>
    </main>
  </body>
</html>
