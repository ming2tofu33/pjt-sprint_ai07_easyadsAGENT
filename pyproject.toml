[project]
name = "easyads-agent"
version = "0.1.0"
description = "EasyAds MVP orchestrator for LangGraph, LLM, Vision, and T2I pipelines"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "anyio==4.13.0",
    "certifi==2026.5.20",
    "charset-normalizer==3.4.7",
    "click==8.4.1",
    "distro==1.9.0",
    "fastapi==0.136.3",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.17",
    "jiter==0.15.0",
    "jsonpatch==1.33",
    "jsonpointer==3.1.1",
    "langchain-core==1.3.0",
    "langgraph==1.1.3",
    "langgraph-checkpoint==4.1.1",
    "langgraph-prebuilt==1.0.10",
    "langgraph-sdk==0.3.15",
    "langsmith==0.8.6",
    "openai==2.38.0",
    "orjson==3.11.9",
    "ormsgpack==1.12.2",
    "packaging==26.2",
    "Pillow==12.2.0",
    "pydantic==2.13.4",
    "pydantic-core==2.46.4",
    "python-dotenv==1.2.2",
    "PyYAML==6.0.3",
    "requests==2.34.2",
    "requests-toolbelt==1.0.0",
    "sniffio==1.3.1",
    "starlette==1.2.0",
    "tenacity==9.1.4",
    "tqdm==4.67.3",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "urllib3==2.7.0",
    "uvicorn==0.48.0",
    "uuid-utils==0.16.0",
    "websockets==16.0",
    "xxhash==3.7.0",
    "zstandard==0.25.0",
    "psycopg[binary]==3.3.4",
    "boto3==1.43.22",
    "modal==1.4.3",
    "langgraph-checkpoint-postgres>=3.1.0",
    "psycopg-pool>=3.3.1",
]

[dependency-groups]
dev = [
    "colorama==0.4.6",
    "iniconfig==2.3.0",
    "pluggy==1.6.0",
    "pygments==2.20.0",
    "pytest==9.0.3",
]

[project.optional-dependencies]
gpu-cu118 = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "torchaudio==2.7.1",

    "diffusers",
    "transformers==5.10.2",
    "accelerate==1.13.0",
    "huggingface-hub==1.18.0",

    "safetensors==0.8.0rc1",
    "sentencepiece==0.2.1",
    "protobuf==6.33.6",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu118", extra = "gpu-cu118" },
]
torchvision = [
    { index = "pytorch-cu118", extra = "gpu-cu118" },
]
torchaudio = [
    { index = "pytorch-cu118", extra = "gpu-cu118" },
]
diffusers = { git = "https://github.com/huggingface/diffusers.git", rev = "41875e08abc13e27c43620d6a9742e72646310e8" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.pytest.ini_options]
# Always isolate tests from .env / docs/api_key.env (real key sets enable_api_call=true,
# breaking disabled-path tests). Plugin lives in eval/ to avoid git-pull conflict with
# develop's tests/conftest.py. Makefile passes the same -p explicitly.
addopts = "-p orchestrator.eval.dotenv_isolation"
markers = [
    "unit: isolated pure-function or component test",
    "integration: multiple internal components or application wiring",
    "contract: public interface, serialization, adapter, or runner contract",
    "e2e: end-to-end user or graph workflow",
    "regression: reproduces and protects a previously observed defect",
    "external: may communicate with an external provider or remote service",
    "actual: performs a real provider/model/storage call",
    "slow: intentionally expensive or long-running test",
    "critical: protects a critical production invariant",
    "security: protects authorization, tenant, secret, or public-boundary behavior",
    "transaction: protects atomicity, rollback, concurrency, or idempotency",
    "graph: validates LangGraph state, node, edge, routing, or resume behavior",
]
